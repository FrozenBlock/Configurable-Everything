    mod_id = configurable_everything
	mod_version = 1.3.2
	maven_group = net.frozenblock
	archives_base_name = ConfigurableEverything

# Dependencies
	fabric_version=0.155.2+26.2
    fabric_kotlin_version=1.13.13+kotlin.2.4.10
	frozenlib_version=2.5.3-mc26.2

# External Mods
    cloth_config_version=26.2.155
	modmenu_version=20.0.1

	# Optimization
	sodium_version=mc26.1.2-0.9.1-fabric
